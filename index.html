<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>5月活動大禮包 - 最終完整版</title>

  <style>
    /* 這裡就是你遺失的「裝潢」：背景與邊框 */
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background-color: #0a191f; 
      background-image: radial-gradient(circle at center, rgba(44, 83, 100, 0.4) 0%, rgba(10, 25, 31, 0.95) 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 金色邊框 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 15px solid transparent;
      border-image: linear-gradient(45deg, #b8860b, #ffd700, #b8860b) 1;
      pointer-events: none; 
      z-index: 100;
    }

    /* 禮物盒樣式 */
    .gift-box {
      width: 200px; height: 200px; background: #e63946; 
      position: relative; border-radius: 30px; cursor: pointer;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); transition: 0.3s;
    }
    .gift-box:hover { transform: scale(1.05) rotate(2deg); }

    /* 絲帶與蝴蝶結的 CSS (這是畫出圖案的關鍵) */
    .ribbon-v { position: absolute; width: 40px; height: 100%; background: #facc15; left: 50%; transform: translateX(-50%); }
    .ribbon-h { position: absolute; width: 100%; height: 40px; top: 50%; transform: translateY(-50%); background: #facc15; }
    .bow {
      position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 60px; background: #facc15; border-radius: 50px; z-index: 10;
    }

    /* 活動卡片設定 */
    .activities { display: none; flex-wrap: wrap; justify-content: center; gap: 30px; padding: 20px; }
    .activity-card {
      background: white; color: #333; padding: 30px; border-radius: 30px;
      width: 320px; text-align: center; border: 5px solid #facc15; text-decoration: none;
    }
    .click-go { color: #ef4444; font-weight: 900; margin-top: 15px; }

    .open { animation: openBox 0.8s forwards; }
    @keyframes openBox { 100% { transform: scale(0) rotate(360deg); opacity: 0; } }
  </style>
</head>

<body>
  <div id="gift-area">
    <div id="gift" class="gift-box" onclick="openGift()">
      <div class="bow"></div>
      <div class="ribbon-v"></div>
      <div class="ribbon-h"></div>
    </div>
    <p style="text-align: center; color: #ffd700; margin-top: 20px; font-weight: bold;">🎁 點擊開啟 Surprise!</p>
  </div>

  <div id="activities" class="activities">
    <h2 style="width: 100%; text-align: center; color: #ffd700;">✨ 5月專屬活動推薦 ✨</h2>
    
    <a href="https://itouch.cycu.edu.tw/go/?w=15434@acpm3" target="_blank" class="activity-card">
      <h3>ASE 說明會</h3>
      <p>走進晶片世界，掌握科技未來</p>
      <div class="click-go">👉 點擊報名 / Register</div>
    </a>

    <a href="https://itouch.cycu.edu.tw/go/?w=15435@acpm3" target="_blank" class="activity-card">
      <h3>職涯發展座談會</h3>
      <p>跨出領域界線，開啟無限可能</p>
      <div class="click-go">👉 點擊報名 / Register</div>
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    function openGift() {
      const gift = document.getElementById("gift");
      const giftArea = document.getElementById("gift-area");
      const activities = document.getElementById("activities");
      gift.classList.add("open");
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      setTimeout(() => {
        giftArea.style.display = "none";
        activities.style.display = "flex";
      }, 750);
    }
  </script>
</body>
</html>
