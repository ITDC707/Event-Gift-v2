<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>活動開箱</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .container {
    text-align: center;
    perspective: 1000px;
  }

  /* 禮物盒整體 */
  .gift-box {
    width: 160px;
    height: 160px;
    background: #ef4444;
    margin: auto;
    position: relative;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    transition: transform 0.3s ease;
  }

  .gift-box:hover {
    transform: translateY(-5px) rotate(2deg);
  }

  /* 絲帶與蝴蝶結 */
  .ribbon-v, .ribbon-h {
    position: absolute;
    background: #facc15;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }
  .ribbon-v { width: 30px; height: 100%; left: 50%; transform: translateX(-50%); }
  .ribbon-h { width: 100%; height: 30px; top: 50%; transform: translateY(-50%); }

  .bow {
    position: absolute;
    top: -25px; left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 40px;
    z-index: 10;
  }
  .bow::before, .bow::after {
    content: "";
    position: absolute;
    width: 45px; height: 45px;
    background: #facc15;
    border-radius: 50% 50% 0 50%;
  }
  .bow::before { left: 0; transform: rotate(-15deg); }
  .bow::after { right: 0; transform: rotate(105deg) scaleX(-1); }

  /* 開箱動畫 */
  .open {
    animation: openBox 1s forwards ease-in-out;
  }
  @keyframes openBox {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0) rotate(720deg); opacity: 0; }
  }

  /* 活動卡片區 */
  .activities {
    display: none;
    animation: fadeIn 0.5s forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .activity-card {
    background: rgba(255, 255, 255, 0.1);
    padding: 20px;
    margin: 15px auto;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.2);
    width: 250px;
  }
</style>
</head>

<body>

<div class="container">
  <div id="gift" class="gift-box" onclick="openGift()">
    <div class="bow"></div>
    <div class="ribbon-v"></div>
    <div class="ribbon-h"></div>
  </div>

  <div id="activities" class="activities">
    <h2>🎉 精選活動推薦</h2>
    <div class="activity-card">
      <h3>半導體產業講座</h3>
      <p>了解全球最熱門產業趨勢</p>
    </div>
    <div class="activity-card">
      <h3>企業徵才說明會</h3>
      <p>直接與企業 HR 面對面</p>
    </div>
  </div>
</div>

<script>
function openGift() {
  const gift = document.getElementById("gift");
  const activities = document.getElementById("activities");

  gift.classList.add("open");

  setTimeout(() => {
    gift.style.display = "none";
    activities.style.display = "block";
  }, 700);
}
</script>

</body>
</html>
